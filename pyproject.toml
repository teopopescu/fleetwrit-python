[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetwrit"
version = "0.1.0a1"
description = "The independent authorisation record for consequential AI-agent actions."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Fleetwrit" }]
keywords = ["ai", "agents", "human-in-the-loop", "approval", "authorization", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
    "pydantic>=2",
    "cryptography>=41",
]

[project.urls]
Homepage = "https://fleetwrit.dev"
Repository = "https://github.com/fleetwrit/fleetwrit-python"

[project.optional-dependencies]
langchain = ["langgraph>=0.2"]
llamaindex = ["llama-index-core>=0.11"]
openai-agents = ["openai-agents>=0.0.1"]
agentcore = ["boto3>=1.34"]
opa = ["httpx>=0.24"]
cedar = ["cedarpy>=3"]
dev = [
    "pytest>=7",
    "hypothesis>=6",
    "jsonschema>=4",
]

[project.scripts]
fleetwrit = "fleetwrit.cli:main"

[project.entry-points.pytest11]
fleetwrit = "fleetwrit.testing"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetwrit"]

[tool.hatch.build.targets.sdist]
include = ["src/fleetwrit", "protocol", "examples", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
